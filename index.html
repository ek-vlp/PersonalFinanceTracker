
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>
<body>

    <h1>Personal Finance Tracker</h1>
    <p>Welcome to your personal finance dashboard!</p>

    <!-- Financial Summary -->
    <h2>My Financial Summary</h2>

    <div class="summary">
        <div class="card">
            <h3>Total Income</h3>
            <p id="totalIncome">₹25,000</p>
        </div>

        <div class="card">
            <h3>Total Expenses</h3>
            <p id="totalExpenses">₹10,000</p>
        </div>

        <div class="card">
            <h3>Remaining Balance</h3>
            <p id="balance">₹15,000</p>
        </div>
    </div>

    <div class="summary-card">
        <h3>Total Transactions</h3>
        <p id="totalTransactions">0</p>
    </div>

        <!-- Income vs Expenses Chart -->
    <h2>Income vs. Expenses Chart</h2>

    <canvas id="incomeExpenseChart" width="600" height="300"></canvas>

    <!-- Add Transaction -->
    <h2>Add Transaction</h2>

    <form id="transactionForm">
        <label for="type">Transaction Type</label>
        <select id="type" required>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>

        <label for="category">Category</label>
        <select id="category" required>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Salary">Salary</option>
            <option value="Other">Other</option>
        </select>

        <label for="description">Description</label>
        <input
            type="text"
            id="description"
            placeholder="e.g. Salary or Food"
            required
        >

        <label for="amount">Amount (₹)</label>
        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            min="0.01"
            step="0.01"
            required
        >
        <label for="date">Transaction Date</label>
        <input type="date" id="date" required>

        <button type="submit">Add Transaction</button>
    </form>

    
    <!-- Recent Transactions -->
    <h2>Recent Transactions</h2>
    
    <label for="searchInput">Search Transactions</label>
    <input
       type="text"
       id="searchInput"
       placeholder="Search by description..."
    >

    <label for="categoryFilter">Filter by Category</label>
    <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Salary">Salary</option>
        <option value="Other">Other</option>
    </select>
    
    <label for="sortOrder">Sort by Date</label>
    <select id="sortOrder">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
    </select>

    <ul id="transactionList"></ul>


    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
    

</body>
</html>
